name: Build C# Android Toolkit
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Project
        run: dotnet publish src/AndroidToolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: Gissa333-Android-Toolkit
          path: ./publish/AndroidToolkitPro.exe